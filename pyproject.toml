[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-agent"
version = "0.1.0"
description = "Core ingestion and retrieval service for an AI requirements agent"
requires-python = ">=3.11"

[project.scripts]
requirements-agent = "requirements_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
